<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medidor de latencias</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif}
body{max-width:42rem;margin:0 auto;padding:1rem;line-height:1.4}
h1{font-size:1.3rem;margin:.2rem 0}
#st{font-size:.85rem;opacity:.7}
svg{width:100%;height:auto;margin:.5rem 0}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.card{border:1px solid #8886;border-radius:.6rem;padding:.6rem .8rem}
.big{font-size:2rem;font-weight:700}
.vis{color:#e8590c}.aud{color:#1c7ed6}
small{opacity:.7}
table{width:100%;border-collapse:collapse;margin-top:1rem}
td,th{padding:.3rem;text-align:right;border-bottom:1px solid #8884}
</style></head><body>
<h1>Medidor de latencias</h1>
<div id="st">Conectando…</div>
<svg id="chart" viewBox="0 0 600 200"></svg>
<div class="cards">
  <div class="card"><b class="vis">Visual</b><div class="big"><span id="v">—</span> <small>ms</small></div>
    <small>promedio <span id="va">—</span> ms</small></div>
  <div class="card"><b class="aud">Auditivo</b><div class="big"><span id="a">—</span> <small>ms</small></div>
    <small>promedio <span id="aa">—</span> ms</small></div>
</div>
<table><thead><tr><th>#</th><th>Visual (ms)</th><th>Auditivo (ms)</th></tr></thead><tbody id="rows"></tbody></table>
<script>
const $=id=>document.getElementById(id);
let trials=[];
const nice=m=>{for(const s of[10,20,50,100,200,500,1000,2000,5000])if(m<=s)return s;return Math.ceil(m/1000)*1000};
function draw(t){
  const W=600,L=80,R=20,top=30;
  const mx=nice(Math.max(t&&t.vis||0,t&&t.aud||0,40)*1.3);
  const x=v=>L+(W-L-R)*v/mx;
  let s='';
  for(let i=0;i<=5;i++){const v=mx*i/5;
    s+=`<line x1="${x(v)}" x2="${x(v)}" y1="${top}" y2="150" stroke="currentColor" opacity=".15"/>`+
       `<text x="${x(v)}" y="168" text-anchor="middle" font-size="12" fill="currentColor">${v}</text>`}
  s+=`<text x="${(L+W-R)/2}" y="192" text-anchor="middle" font-size="12" fill="currentColor">milisegundos desde el estímulo</text>`;
  s+=`<line x1="${x(0)}" x2="${x(0)}" y1="${top-5}" y2="150" stroke="currentColor" stroke-width="2"/>`+
     `<text x="${x(0)}" y="18" text-anchor="middle" font-size="12" fill="currentColor">Estímulo</text>`;
  [['Visual',t&&t.vis,'#e8590c',65],['Auditivo',t&&t.aud,'#1c7ed6',115]].forEach(([n,v,c,y])=>{
    s+=`<text x="${L-8}" y="${y+5}" text-anchor="end" font-size="13" fill="currentColor">${n}</text>`;
    if(v!=null)s+=`<rect x="${x(0)}" y="${y-14}" width="${Math.max(x(v)-x(0),2)}" height="28" rx="4" fill="${c}"/>`+
      `<text x="${x(v)+6}" y="${y+5}" font-size="13" fill="currentColor">${v} ms</text>`;
    else if(t)s+=`<text x="${x(0)+8}" y="${y+5}" font-size="13" fill="currentColor" opacity=".6">sin respuesta</text>`;
  });
  $('chart').innerHTML=s;
}
function render(){
  const t=trials[trials.length-1];
  draw(t);
  const f=v=>v!=null?v.toFixed(1):'—';
  $('v').textContent=f(t&&t.vis);$('a').textContent=f(t&&t.aud);
  const avg=k=>{const a=trials.map(x=>x[k]).filter(x=>x!=null);
    return a.length?(a.reduce((p,c)=>p+c,0)/a.length).toFixed(1):'—'};
  $('va').textContent=avg('vis');$('aa').textContent=avg('aud');
  $('rows').innerHTML=trials.slice(-10).reverse()
    .map(x=>`<tr><td>${x.n}</td><td>${f(x.vis)}</td><td>${f(x.aud)}</td></tr>`).join('');
}
function connect(){
  const ws=new WebSocket('ws://'+location.host+'/ws');
  ws.onopen=()=>$('st').textContent='Conectado — esperando estímulos';
  ws.onmessage=e=>{trials.push(JSON.parse(e.data));if(trials.length>50)trials.shift();render()};
  ws.onclose=()=>{$('st').textContent='Reconectando…';setTimeout(connect,1500)};
}
render();
fetch('/history').then(r=>r.json()).then(h=>{trials=h;render()}).catch(()=>{}).finally(connect);
</script></body></html>
